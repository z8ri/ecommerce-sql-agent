logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: localhost
  port: 3306
  user: didilili
  password: dili123
  database: meta

db_dw:
  host: localhost
  port: 3306
  user: didilili
  password: dili123
  # 可以用 DW_DATABASE 指向另一个库（例如安全评测用的一次性沙箱库 dw_sandbox）
  database: ${oc.env:DW_DATABASE,dw}

db_dw_readonly:
  host: localhost
  port: 3306
  user: ${oc.env:DW_RO_USER,dw_ro}
  password: ${oc.env:DW_RO_PASSWORD,dw_ro_pass}
  database: ${oc.env:DW_DATABASE,dw}

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

embedding:
  # 云端 Embedding（百炼）；改回本地 TEI 时设置 provider: tei，并使用 host/port/model: BAAI/bge-large-zh-v1.5
  provider: openai
  model: text-embedding-v4
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key: ${oc.env:LLM_API_KEY}

es:
  host: localhost
  port: 9200
  index_name: data_agent

llm:
  model_name: qwen-plus
  api_key: ${oc.env:LLM_API_KEY}
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

agent:
  # 演示数仓的数据截止日期，相对时间（今天/上个月/最近30天）以此为基准；留空则使用当前日期
  as_of_date: "2025-12-31"
  # 功能开关，用环境变量覆盖可以在评测里做消融对比，例如 AGENT_PIN_METRIC_COLUMNS=false
  pin_metric_columns: ${oc.decode:${oc.env:AGENT_PIN_METRIC_COLUMNS,true}}
  resolve_time: ${oc.decode:${oc.env:AGENT_RESOLVE_TIME,true}}
  self_correct: ${oc.decode:${oc.env:AGENT_SELF_CORRECT,true}}
  max_repairs: ${oc.decode:${oc.env:AGENT_MAX_REPAIRS,2}}
  sql_guard: ${oc.decode:${oc.env:AGENT_SQL_GUARD,true}}
