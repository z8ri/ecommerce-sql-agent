# 问数评测集
#
# 每题包含：自然语言问题 + 标准 SQL（在演示数仓上执行得到标准答案）
# 字段说明：
#   tags          题型标签，用于分题型统计
#   difficulty    easy / medium / hard
#   gold_sql      标准 SQL，评测时在数仓上执行得到标准结果集
#   ordered       结果行顺序是否有意义（排名、Top N、按时间排序时为 true）
#   percent_ok    比例类问题：0.0431 和 4.31 都算对
#   gold_metrics  期望命中的指标名（用于衡量指标召回/选择）
#   gold_values   期望召回的字段取值，格式 表.列.值（用于衡量取值召回）
# 标准答案涉及的表由 gold_sql 自动解析，不需要手工标注。
#
# 统一口径：
#   有效订单 = order_status <> '已取消'（已退款订单计入）
#   GMV = gross_amount 之和；“销售额”默认指 GMV
#   数据截止 2025-12-31：“今年”=2025，“去年”=2024，“上个月”=2025-11，
#   “上季度”=2025Q3，“本季度”=2025Q4，“本月”=2025-12

questions:
  # ------------------------------------------------------------ A. 基础查询
  - id: a01
    question: 所有有效订单一共有多少个？
    tags: [simple_agg, metric_caliber]
    difficulty: easy
    gold_metrics: [订单数]
    gold_sql: |
      SELECT COUNT(*) AS order_cnt FROM fact_order WHERE order_status <> '已取消'

  - id: a02
    question: 系统里一共有多少个客户？
    tags: [simple_agg]
    difficulty: easy
    gold_sql: |
      SELECT COUNT(*) AS customer_cnt FROM dim_customer

  - id: a03
    question: 一共有多少家店铺？
    tags: [simple_agg]
    difficulty: easy
    gold_sql: |
      SELECT COUNT(*) AS shop_cnt FROM dim_shop

  - id: a04
    question: 商品库里有多少个不同的品牌？
    tags: [simple_agg]
    difficulty: easy
    gold_sql: |
      SELECT COUNT(DISTINCT brand) AS brand_cnt FROM dim_product

  - id: a05
    question: 我们的订单一共覆盖了多少个城市？
    tags: [simple_agg, multi_join]
    difficulty: easy
    gold_sql: |
      SELECT COUNT(DISTINCT r.city) AS city_cnt
      FROM fact_order o JOIN dim_region r ON o.region_id = r.region_id

  - id: a06
    question: 有哪些销售渠道？
    tags: [simple_agg]
    difficulty: easy
    gold_sql: |
