    tags: [metric_caliber, time, multi_join]
    difficulty: hard
    gold_metrics: [连带率]
    gold_sql: |
      SELECT SUM(i.quantity) / COUNT(DISTINCT o.order_id) AS items_per_order
      FROM fact_order_item i
      JOIN fact_order o ON i.order_id = o.order_id
      JOIN dim_date d ON o.date_id = d.date_id
      WHERE d.year = 2025 AND o.order_status <> '已取消'

  - id: c13
    question: 2025年有多少个客户下过单？
    tags: [metric_caliber, time]
    difficulty: medium
    gold_metrics: [下单客户数]
    gold_sql: |
      SELECT COUNT(DISTINCT o.customer_id) AS buyer_cnt
      FROM fact_order o JOIN dim_date d ON o.date_id = d.date_id
      WHERE d.year = 2025 AND o.order_status <> '已取消'

  - id: c14
    question: 2025年的净销售额是多少？
    tags: [metric_caliber, time, cross_fact]
    difficulty: hard
    gold_metrics: [净销售额]
    gold_sql: |
      SELECT SUM(o.pay_amount) - COALESCE(SUM(r.refund_amount), 0) AS net_sales
      FROM fact_order o
      JOIN dim_date d ON o.date_id = d.date_id
      LEFT JOIN fact_refund r ON r.order_id = o.order_id
      WHERE d.year = 2025 AND o.order_status <> '已取消'

