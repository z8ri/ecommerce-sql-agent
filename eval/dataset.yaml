  - id: a09
    question: 标价最高的商品是哪个？
    tags: [ranking]
    difficulty: easy
    ordered: true
    gold_sql: |
      SELECT product_name FROM dim_product ORDER BY list_price DESC LIMIT 1

  - id: a10
    question: 一共有多少个已退款的订单？
