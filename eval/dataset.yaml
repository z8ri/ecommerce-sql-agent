    gold_sql: |
      SELECT SUM(o.pay_amount) AS pay_amount
      FROM fact_order o JOIN dim_date d ON o.date_id = d.date_id
      WHERE d.year = 2025 AND o.order_status <> '已取消'

  - id: c03
    question: 2025年的客单价是多少？
    tags: [metric_caliber, time, ratio]
    difficulty: medium
    gold_metrics: [客单价]
    gold_sql: |
      SELECT SUM(o.gross_amount) / COUNT(*) AS aov
      FROM fact_order o JOIN dim_date d ON o.date_id = d.date_id
      WHERE d.year = 2025 AND o.order_status <> '已取消'

  - id: c04
    question: 2025年的退款率是多少？
    tags: [metric_caliber, time, ratio]
    difficulty: medium
    percent_ok: true
    gold_metrics: [退款率]
    gold_sql: |
      SELECT SUM(o.order_status = '已退款') / COUNT(*) AS refund_rate
      FROM fact_order o JOIN dim_date d ON o.date_id = d.date_id
      WHERE d.year = 2025 AND o.order_status <> '已取消'

  - id: c05
    question: 2025年的复购率是多少？
    tags: [metric_caliber, time, ratio]
    difficulty: hard
    percent_ok: true
    gold_metrics: [复购率]
    gold_sql: |
      SELECT SUM(t.cnt >= 2) / COUNT(*) AS repurchase_rate
      FROM (
        SELECT o.customer_id, COUNT(*) AS cnt
        FROM fact_order o JOIN dim_date d ON o.date_id = d.date_id
        WHERE d.year = 2025 AND o.order_status <> '已取消'
        GROUP BY o.customer_id
      ) t

  - id: c06
    question: 2025年新客订单占比是多少？
    tags: [metric_caliber, time, ratio]
    difficulty: medium
    percent_ok: true
    gold_metrics: [新客订单占比]
    gold_sql: |
      SELECT SUM(o.is_new_customer) / COUNT(*) AS new_customer_ratio
      FROM fact_order o JOIN dim_date d ON o.date_id = d.date_id
      WHERE d.year = 2025 AND o.order_status <> '已取消'

  - id: c07
