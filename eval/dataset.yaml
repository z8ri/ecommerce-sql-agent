    tags: [metric_caliber, time, ratio]
    difficulty: medium
    percent_ok: true
    gold_metrics: [好评率]
    gold_sql: |
      SELECT SUM(o.review_score >= 4) / COUNT(o.review_score) AS good_rate
      FROM fact_order o JOIN dim_date d ON o.date_id = d.date_id
      WHERE d.year = 2025

  - id: c08
